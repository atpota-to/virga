# The worker on the droplet. Put its settings in worker/.env (never
# committed; worker/.env.example lists them), then from the repository's root:
#   docker compose -f worker/compose.yaml up -d --build
services:
  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    # The moderator's session and how far its DMs have been read.
    volumes:
      - moderator-data:/data
    # Let a call in flight finish before the container stops.
    stop_grace_period: 75s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  moderator-data:
