<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Virga</title>
    <meta
      name="description"
      content="Analytics for your Bluesky account and the rest of your atproto repo, worked out in your browser from your own data."
    />
    <meta name="theme-color" content="#f5f6f8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Theme and density before the first paint, from what src/lib/preferences.jsx
      // stores, so a dark-mode reader never sees a white flash. Kept tiny on purpose.
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('virga:preferences') || '{}') || {};
          var t = p.theme === 'light' || p.theme === 'dark' ? p.theme
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          document.documentElement.dataset.density = p.density === 'compact' ? 'compact' : 'comfortable';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
