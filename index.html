<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Virga</title>
    <meta
      name="description"
      content="Analytics for your Bluesky account and the rest of your atproto repo, worked out in your browser from your own data."
    />
    <meta name="theme-color" content="#f5f6f8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Theme, accent, contrast and density before the first paint, from what
      // src/lib/preferences.jsx stores, so a dark-mode reader never sees a white
      // flash. Kept tiny on purpose. It has to stamp what rootAttributes() there
      // would: preferences.test.js runs this script against it.
      (function () {
        var p = {};
        try {
          p = JSON.parse(localStorage.getItem('virga:preferences') || '{}') || {};
        } catch (e) {}
        var asks = function (q) {
          return !!(window.matchMedia && window.matchMedia(q).matches);
        };
        var d = document.documentElement.dataset;
        d.theme = p.theme === 'light' || p.theme === 'dark' ? p.theme : asks('(prefers-color-scheme: dark)') ? 'dark' : 'light';
        d.accent = /^(violet|teal|amber|rose|graphite)$/.test(p.accent) ? p.accent : 'blue';
        d.contrast = p.contrast === 'normal' || p.contrast === 'high' ? p.contrast : asks('(prefers-contrast: more)') ? 'high' : 'normal';
        d.density = p.density === 'compact' ? 'compact' : 'comfortable';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
