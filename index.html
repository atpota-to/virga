<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Virga</title>
    <meta
      name="description"
      content="Analytics for your Bluesky account and the rest of your atproto repo, worked out in your browser from your own data."
    />
    <meta name="theme-color" content="#b9d5ff" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // The sky, accent, contrast and density before the first paint, from what
      // src/lib/preferences.jsx stores, so a reader at night never sees a white
      // flash. Kept tiny on purpose. It has to stamp what rootAttributes() there
      // would: preferences.test.js runs this script against it.
      (function () {
        var p = {};
        try {
          p = JSON.parse(localStorage.getItem('virga:preferences') || '{}') || {};
        } catch (e) {}
        var asks = function (q) {
          return !!(window.matchMedia && window.matchMedia(q).matches);
        };
        var d = document.documentElement.dataset;
        var h = new Date().getHours();
        // A sky that was picked; else the theme an earlier version stored;
        // else the clock, with night for a device set to dark.
        var sky = /^(dawn|day|dusk|night)$/.test(p.sky)
          ? p.sky
          : p.sky !== 'clock' && p.theme === 'dark'
            ? 'night'
            : p.sky !== 'clock' && p.theme === 'light'
              ? 'day'
              : asks('(prefers-color-scheme: dark)') || h < 5 || h >= 20
                ? 'night'
                : h < 8
                  ? 'dawn'
                  : h < 17
                    ? 'day'
                    : 'dusk';
        d.sky = sky;
        d.theme = sky === 'night' ? 'dark' : 'light';
        d.accent = /^(violet|teal|amber|rose|graphite)$/.test(p.accent) ? p.accent : 'blue';
        d.contrast = p.contrast === 'normal' || p.contrast === 'high' ? p.contrast : asks('(prefers-contrast: more)') ? 'high' : 'normal';
        d.density = p.density === 'compact' ? 'compact' : 'comfortable';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
